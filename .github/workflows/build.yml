name: Build Release APK

on:
  push:
  workflow_dispatch:

permissions:
  contents: write
  actions: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # 📥 Checkout
      - name: Checkout
        uses: actions/checkout@v4

      # ☕ JDK
      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          cache: gradle

      # 🤖 Android SDK (runner đã có sẵn cmdline-tools, dùng sdkmanager cài trực tiếp)
      - name: Setup Android SDK
        run: |
          SDKMANAGER="${ANDROID_HOME:-/usr/local/lib/android/sdk}/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMANAGER" --licenses >/dev/null 2>&1 || true
          "$SDKMANAGER" --install "platform-tools" "platforms;android-36" "build-tools;34.0.0"

      # 🔑 Cấp quyền gradlew
      - name: Grant permission
        run: chmod +x gradlew

      # 🏷 Tạo tag trước (để dùng rename APK)
      - name: Generate tag
        id: tag
        run: echo "tag=v1.$(date +'%Y%m%d%H%M%S')" >> $GITHUB_OUTPUT

      # 🛠 Build APK (đã có signing trong build.gradle)
      - name: Build Release APK
        run: ./gradlew assembleRelease --stacktrace

      # 🏷 Rename APK theo tag
      - name: Rename APK
        run: |
          mv app/build/outputs/apk/release/app-release.apk \
             app/build/outputs/apk/release/kkphim-${{ steps.tag.outputs.tag }}.apk

      # 🚀 Tạo GitHub Release + upload APK
      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.tag }}
          name: Release ${{ steps.tag.outputs.tag }}
          body: APK build tự động 🚀
          files: app/build/outputs/apk/release/kkphim-${{ steps.tag.outputs.tag }}.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # 🧹 Xoá release cũ (giữ lại 1 bản)
      - name: Delete old releases
        uses: dev-drprasad/delete-older-releases@v0.3.4
        with:
          keep_latest: 1
          delete_tags: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # 🧹 Xoá workflow run cũ
      - name: Delete old workflow runs
        uses: Mattraks/delete-workflow-runs@v2
        with:
          retain_days: 0
          keep_minimum_runs: 0
